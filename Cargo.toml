[package]
name = "modwatt"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui_extras = "0.37"

[features]
# Dev aid: `EFRAME_SCREENSHOT_TO=out.png MODWATT_DEMO=1 cargo run --features screenshot`
# renders one frame (after a simulator scan) to a PNG and exits.
screenshot = ["eframe/glow", "eframe/__screenshot"]
